:root{
  /* color: primitivos */
  --violet-950:#0A0730; --violet-800:#3A21A6; --violet-600:#5A3FEA; --violet-700:#4A31D6;
  --lavender-300:#C1B3FF; --lavender-100:#ECE7FF; --mist:#F6F4FD; --white:#FFFFFF;
  --ink-900:#120B33; --ink-600:#5E5880; --ink-400:#A29CBC; --line:#E9E6F3;
  --agua-300:#7CF5DF; --green-700:#0B7A5C;
  --amber-700:#8A5A00; --amber-100:#FCEFCF; --red-600:#C23A4B; --red-100:#FDE6E9;

  /* color: semánticos */
  --bg:var(--mist); --surface:var(--white); --tint:var(--lavender-100);
  --text:var(--ink-900); --text-2:var(--ink-600); --text-3:var(--ink-400); --border:var(--line);
  --action:var(--violet-600); --action-press:var(--violet-700); --on-action:#fff;
  --night-1:var(--violet-950); --night-2:var(--violet-800); --night-glow:rgba(135,95,255,.5);
  --on-night:#fff; --on-night-2:rgba(255,255,255,.66); --on-night-3:rgba(255,255,255,.12);
  --agent:var(--agua-300); --on-agent:var(--ink-900);      /* SOLO lo que dice o propone el agente */
  --deposit:var(--lavender-300);                         /* plazos fijos que no están en foco */
  --available:rgba(255,255,255,.9);                      /* dinero disponible (sobre noche) */
  --positive:var(--green-700); --warn:var(--amber-700); --warn-bg:var(--amber-100);
  --danger:var(--red-600); --danger-bg:var(--red-100); --focus:#2F7DFF;

  /* tipografía */
  --font:"Schibsted Grotesk",system-ui,sans-serif;
  --t-display:700 44px/44px var(--font);  --t-display-ls:-.035em;
  --t-title1:700 30px/32px var(--font);   --t-title1-ls:-.03em;
  --t-title2:650 22px/26px var(--font);   --t-title2-ls:-.02em;
  --t-amount:700 30px/32px var(--font);
  --t-headline:650 16px/21px var(--font);
  --t-body:400 15px/21px var(--font);
  --t-callout:400 14px/20px var(--font);
  --t-label:500 13px/17px var(--font);
  --t-caption:500 12px/16px var(--font);

  /* espacio (base 4) y radios */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;
  --r-chip:999px; --r-s:12px; --r-m:16px; --r-card:20px; --r-night:26px; --r-sheet:32px;
  --e-card:0 1px 0 rgba(18,11,51,.04); --e-sheet:0 -12px 40px -12px rgba(10,7,48,.35);
}

/* ---------- base ---------- */
.pf{font:var(--t-body);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:where(.pf) *{box-sizing:border-box;margin:0}
:where(.pf) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.pf :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pf svg{display:block;flex:none}
.t-display{font:var(--t-display);letter-spacing:var(--t-display-ls)}
.t-title1{font:var(--t-title1);letter-spacing:var(--t-title1-ls)}
.t-title2{font:var(--t-title2);letter-spacing:var(--t-title2-ls)}
.t-amount{font:var(--t-amount);letter-spacing:-.03em}
.t-headline{font:var(--t-headline)}
.t-body{font:var(--t-body)}
.t-callout{font:var(--t-callout)}
.t-label{font:var(--t-label)}
.t-caption{font:var(--t-caption)}
.c2{color:var(--text-2)} .c3{color:var(--text-3)} .pos{color:var(--positive)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* ---------- botones ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:var(--r-chip);font:650 15.5px/1 var(--font);width:100%;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn--primary{background:var(--action);color:var(--on-action)}
.btn--secondary{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--border)}
.btn--tertiary{color:var(--text-2);height:40px}
.btn--agent{background:var(--agent);color:var(--on-agent)}
.btn--on-night{background:var(--on-night-3);color:#fff}
.btn--s{height:40px;font-size:14px;padding:0 16px}
.btn[disabled]{background:var(--line);color:var(--text-3);box-shadow:none}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--text)}
.night .icon-btn,.icon-btn--night{background:var(--on-night-3);color:#fff}

/* ---------- chips ---------- */

/* ---------- motor ---------- */
const R = id => SCREENS[id].r();
let stack = [], autoT;
function render(id, tr = 'none') {
  const sc = SCREENS[id]; const vp = document.getElementById('vp'); const old = vp.querySelector('.layer:not(.leaving)');
  const el = document.createElement('div'); el.className = 'layer' + (sc.night ? ' layer--night' : '') + (sc.bank ? ' layer--bank' : ''); el.dataset.id = id;
  el.innerHTML = `<div class="scr">${sc.r()}</div>`;
  el.querySelectorAll('.scr .foot, .scr .scrim, .scr .sheet, .scr .toast-wrap, .scr .faceid, .scr .bk-tab').forEach(n => { if (!n.parentElement.closest('.sheet')) el.appendChild(n); });
  if (old && old.dataset.id === id) { const st = old.querySelector('.scr').scrollTop; old.replaceWith(el); el.querySelector('.scr').scrollTop = st; el.querySelectorAll('.sheet,.scrim,.toast,.faceid').forEach(x => x.style.animation = 'none'); }
  else { vp.appendChild(el); if (old && tr !== 'none') { old.classList.add('leaving', 'out-' + tr); el.classList.add('in-' + tr); setTimeout(() => old.remove(), 420); } else if (old) old.remove(); }
  document.getElementById('sb').className = 'statusbar' + (sc.sb === 'light' || sc.night ? ' statusbar--light' : '');
  document.querySelectorAll('[data-jump]').forEach(b => b.classList.toggle('on', b.dataset.jump === id));
  clearTimeout(autoT); if (sc.auto && !document.body.classList.contains('shot')) autoT = setTimeout(() => go(sc.auto[0], 'fade'), sc.auto[1]);
}
function go(id, tr = 'push') { const n = SCREENS[id].pop || 0; if (n) stack.splice(Math.max(0, stack.length - n)); stack.push(id); render(id, tr); }
function back() { if (stack.length < 2) return; const cur = stack.pop(); const prev = stack[stack.length - 1]; render(prev, SCREENS[cur].modal ? 'down' : (['ajustar', 'opciones'].includes(cur) ? 'none' : 'pop')); }
function setPath(p, v) { const ks = p.split('.'); let o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = v === 'true' ? true : v === 'false' ? false : (/^-?\d+$/.test(v) ? +v : v); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-go],[data-back],[data-jump]'); if (!t || t.disabled) return;
  if (t.dataset.jump) { stack = [t.dataset.jump]; render(t.dataset.jump); return; }
  if (t.dataset.set) t.dataset.set.split(';').forEach(p => { const i = p.indexOf('='); setPath(p.slice(0, i), p.slice(i + 1)); });
  if (t.dataset.go) { if (stack[stack.length - 1] === t.dataset.go) return render(t.dataset.go); return go(t.dataset.go, t.dataset.tr || (SCREENS[t.dataset.go].modal ? 'up' : 'push')); }
  if (t.dataset.back !== undefined) return back();
  render(stack[stack.length - 1]);
});
window.addEventListener('DOMContentLoaded', () => {
  const q = new URLSearchParams(location.search), shot = q.get('shot');
  if (shot) { document.body.classList.add('shot'); if (shot === 'revisar' || shot === 'faceid') S.ack = true; }
  const side = document.getElementById('side');
  if (side) { const g = {}; Object.entries(SCREENS).forEach(([id, s]) => (g[s.f] = g[s.f] || []).push([id, s.l])); let n = 0;
    side.innerHTML += Object.entries(g).map(([k, items]) => `<div class="side__g"><p>${k}</p>${items.map(([id, l]) => `<button data-jump="${id}"><span>${String(++n).padStart(2, '0')}</span>${l}</button>`).join('')}</div>`).join(''); }
  const start = shot || q.get('s') || 'inicio'; stack = [start]; render(start);
});
window.PF = { SCREENS, S };
</script>
