:root{
  /* --- color: primitivos --- */
  --forest-900:#00301F;
  --forest-700:#004E38;   /* logo */
  --forest-500:#2C6E55;
  --sage-400:#8FB896;     /* logo */
  --sage-200:#CFE0D3;
  --sage-100:#E1EADF;
  --lime-400:#C6F36B;
  --lime-100:#ECF9CF;
  --mist:#F1F5EE;
  --white:#FFFFFF;
  --ink-900:#12261E;
  --ink-600:#4A5C53;
  --ink-500:#5C6C64;
  --ink-300:#97A39C;
  --line:#DCE4DA;
  --coral-700:#A3341E;
  --coral-500:#C8452A;
  --coral-100:#F8DCD3;
  --amber-700:#7D5300;
  --amber-100:#FBEBC5;

  /* --- color: semánticos --- */
  --bg:var(--mist);
  --surface:var(--white);
  --surface-sunk:var(--sage-100);
  --brand:var(--forest-700);
  --brand-strong:var(--forest-900);
  --on-brand:#E6F0E8;
  --action:var(--forest-700);          /* botón primario sobre fondo claro */
  --on-action:#FFFFFF;
  --action-on-brand:var(--lime-400);   /* botón primario sobre bosque */
  --on-action-on-brand:#0F2A1F;
  --text:var(--ink-900);
  --text-2:var(--ink-500);
  --text-3:var(--ink-300);
  --border:var(--line);
  --focus:#2F7DFF;
  --ok:var(--forest-700);   --ok-bg:var(--sage-100);
  --warn:var(--amber-700);  --warn-bg:var(--amber-100);
  --urgent:var(--coral-700);--urgent-bg:var(--coral-100);--urgent-solid:var(--coral-500);

  /* --- tipografía --- */
  --font-display:"Young Serif",Georgia,serif;
  --font-ui:"Albert Sans",system-ui,sans-serif;
  --t-display:400 34px/38px var(--font-display);
  --t-title1:400 28px/32px var(--font-display);
  --t-title2:400 22px/27px var(--font-display);
  --t-num:400 30px/32px var(--font-display);
  --t-headline:600 17px/22px var(--font-ui);
  --t-body:400 16px/23px var(--font-ui);
  --t-body-strong:600 16px/23px var(--font-ui);
  --t-callout:400 15px/21px var(--font-ui);
  --t-subhead:500 14px/19px var(--font-ui);
  --t-footnote:400 13px/18px var(--font-ui);
  --t-caption:500 12px/16px var(--font-ui);

  /* --- espacio (base 4) --- */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;

  /* --- radios: según tamaño, no uno para todo --- */
  --r-xs:8px;    /* badges */
  --r-s:14px;    /* inputs, filas */
  --r-m:20px;    /* tarjetas chicas, íconos de acceso */
  --r-l:26px;    /* tarjetas grandes */
  --r-xl:32px;   /* sheets */
  --r-pill:999px;

  /* --- elevación: solo para lo que flota --- */
  --e-float:0 12px 30px -12px rgba(0,48,31,.28);
  --e-sheet:0 -10px 40px -10px rgba(0,48,31,.25);
}

/* ============ base ============ */
.pd{font:var(--t-body);color:var(--text);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
:where(.pd) *{box-sizing:border-box;margin:0}
:where(.pd) button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.pd :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pd svg{display:block;flex:none}

.t-display{font:var(--t-display)}
.t-title1{font:var(--t-title1)}
.t-title2{font:var(--t-title2)}
.t-num{font:var(--t-num)}
.t-headline{font:var(--t-headline)}
.t-body{font:var(--t-body)}
.t-callout{font:var(--t-callout)}
.t-subhead{font:var(--t-subhead)}
.t-footnote{font:var(--t-footnote)}
.t-caption{font:var(--t-caption)}
.c2{color:var(--text-2)}
.c3{color:var(--text-3)}
.cb{color:var(--brand)}

/* ============ botones ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 22px;border-radius:var(--r-pill);font:600 16px/1 var(--font-ui)!important;white-space:nowrap;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn--block{display:flex;width:100%}
.btn--primary{background:var(--action);color:var(--on-action)!important}
.btn--lime{background:var(--action-on-brand);color:var(--on-action-on-brand)!important}
.btn--secondary{background:var(--surface);color:var(--brand)!important;box-shadow:inset 0 0 0 1.5px var(--border)}
.btn--ghost-on-brand{color:#fff!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.btn--tertiary{height:44px;padding:0 12px;color:var(--brand)!important}
.btn--urgent{background:var(--urgent-solid);color:#fff!important}
.btn--danger-text{color:var(--urgent)!important}
.btn--s{height:40px;padding:0 16px;font-size:14px!important}
.btn[disabled]{background:var(--sage-200);color:var(--text-3)!important;box-shadow:none}

.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface-sunk);color:var(--brand)}
.icon-btn--on-brand{background:rgba(255,255,255,.1);color:#fff}

/* ============ chips / badges ============ */
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-pill);background:var(--surface-sunk);color:var(--ink-600);font:600 14px/1 var(--font-ui);white-space:nowrap}
.chip--on{background:var(--brand);color:#fff}
.chip--pet{padding-left:5px}
.chip--line{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--border)}
.chip--line.chip--on{background:var(--brand);box-shadow:none}

.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:var(--r-xs);font:600 12px/1 var(--font-ui);white-space:nowrap}
.badge--ok{background:var(--ok-bg);color:var(--ok)}
.badge--warn{background:var(--warn-bg);color:var(--warn)}
.badge--urgent{background:var(--urgent-bg);color:var(--urgent)}
.badge--neutral{background:var(--surface-sunk);color:var(--ink-600)}
.badge--lime{background:var(--lime-400);color:var(--on-action-on-brand)}

/* avatar de mascota: inicial sobre salvia (sin ilustraciones) */
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sage-400);color:var(--forest-900);font:700 12px/1 var(--font-ui);flex:none}
.av--l{width:56px;height:56px;font-size:20px}
.av--xl{width:84px;height:84px;font:400 34px/1 var(--font-display)}
.av--t{background:#E8D3A6;color:#5B3D0E}
.av--p{background:#D9CFE6;color:#3E2D57}

/* ============ superficies ============ */
.card{background:var(--surface);border-radius:var(--r-l);padding:var(--s5)}
.card--brand{background:var(--brand);color:var(--on-brand)}
.card--brand .t-title1,.card--brand .t-num,.card--brand .t-display{color:#fff}
.card--sunk{background:var(--surface-sunk)}
.card--urgent{background:var(--urgent-bg);color:var(--urgent)}
.card--s{border-radius:var(--r-m);padding:14px 16px}

.list{background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:60px;width:100%;text-align:left}
.row + .row{box-shadow:inset 0 1px 0 var(--border)}
.row__main{flex:1;min-width:0}
.row__title{font:600 16px/21px var(--font-ui)}
.row__sub{font:var(--t-footnote);color:var(--text-2);margin-top:2px}
.row__lead{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-sunk);color:var(--brand);flex:none}
.row__chev{color:var(--text-3)}
.row--on{background:var(--lime-100)}

.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.sec h3{font:var(--t-title2)}
.sec a,.sec button{font:600 14px/1 var(--font-ui);color:var(--brand)}

/* ============ formularios ============ */
.field{display:block}
.field__label{font:600 14px/19px var(--font-ui);margin-bottom:8px;display:block}

function horaScreen(re) {
  const B = re ? S.re : S.bk, K = re ? 're' : 'bk'; if (re) S.re.sede = DET[S.det].sede;
  const vets = re ? ['any', S.det === 'eco' ? 'luna' : 'ferreyra'] : ['any', 'ortiz', 'ferreyra'];
  const am = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30'], pm = ['15:00', '15:30', '16:00', '16:30', '17:00', '17:30', '18:00', '18:30'];
  const off = new Set(['09:00', '10:00', '11:30', '15:30', '16:00', '18:30']);
  const sl = a => `<div class="slots">${a.map(h => `<button class="slot ${off.has(h) ? 'off' : B.slot === h ? 'on' : ''}" ${off.has(h) ? 'disabled aria-label="No disponible"' : `data-set="${K}.slot=${h}"`}>${h}</button>`).join('')}</div>`;
  return `${nav(re ? 'Reprogramar' : 'Pedir turno')}
  ${pad(`${re ? `<div class="note note--info" style="margin-bottom:18px">${ic('calendar', 20)}<span>Ahora: <b>${DET[S.det].t} de ${PETS[DET[S.det].pet].n}, ${DET[S.det].day.toLowerCase()} a las ${DET[S.det].h}</b></span></div>` : steps(3, 4) + `<div style="height:24px"></div>`}
  ${re ? H('Elegí un nuevo horario') : H('Elegí día y horario')}
  <div class="hscroll" style="margin-top:18px">${vets.map(v => `<button class="chip chip--line ${B.vet === v ? 'chip--on' : ''}" data-set="${K}.vet=${v}">${VETS[v]}</button>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px"><span class="t-headline">Mayo</span><span class="t-footnote c2">${SEDES[B.sede].n}</span></div>
  <div class="days">${DAYS.map(([d, n]) => `<button class="day ${B.day === String(n) ? 'on' : ''} ${n === 7 ? 'off' : ''}" ${n === 7 ? 'disabled' : `data-set="${K}.day=${n}"`}><span>${d}</span><b>${n}</b></button>`).join('')}</div>
  <p class="t-subhead c2" style="margin:20px 0 10px">Mañana</p>${sl(am)}
  <p class="t-subhead c2" style="margin:20px 0 10px">Tarde</p>${sl(pm)}`)}
  ${foot(`<button class="btn btn--primary btn--block" data-go="${re ? 'reprog-ok' : 't-revisar'}" ${re ? 'data-tr="pop" data-set="re.done=true;re.for=' + S.det + '"' : ''}>${re ? `Cambiar al ${fmtDay(S.re)}, ${S.re.slot}` : 'Continuar'}</button>`)}`;
}
SCREENS['reprog-ok'] = { f: 'Turnos', pop: 2, l: 'Turno reprogramado (aviso)', r: () => `${R('t-detalle')}<div class="toast" role="status">${ic('check', 20, 2.6)}<span>Listo, cambiaste el turno al ${fmtDay(S.re)}, ${S.re.slot}</span></div>` };

/* ---------- motor ---------- */
const R = id => SCREENS[id].r();
let stack = [];
const viewport = () => document.getElementById('vp');

function render(id, tr = 'none') {
  const sc = SCREENS[id]; if (!sc) return;
  const vp = viewport(); const old = vp.querySelector('.layer:not(.leaving)');
  const el = document.createElement('div');
  el.className = 'layer' + (sc.brand ? ' layer--brand' : '');
  el.innerHTML = `<div class="scr ${sc.tab ? 'scr--tab' : ''}">${sc.r()}</div>`;
  el.dataset.id = id;
  // lo que flota (barra, pie, compositor, hojas, avisos) sale del área que scrollea y queda fijo a la pantalla
  el.querySelectorAll('.scr .tabbar, .scr .foot, .scr .composer, .scr .scrim, .scr .sheet, .scr .toast').forEach(n => {
    if (!n.parentElement.closest('.scrim, .sheet')) el.appendChild(n);
  });
  if (old && old.dataset.id === id) { const st = old.querySelector('.scr').scrollTop; old.replaceWith(el); el.querySelector('.scr').scrollTop = st; el.querySelectorAll('.sheet,.scrim,.toast').forEach(x => x.style.animation = 'none'); }
  else {
    vp.appendChild(el);
    if (old && tr !== 'none') {
      old.classList.add('leaving', 'out-' + tr); el.classList.add('in-' + tr);
      setTimeout(() => old.remove(), 420);
    } else if (old) old.remove();
  }
  document.getElementById('sb').className = 'statusbar' + (sc.sb === 'light' ? ' statusbar--light' : '');
  document.querySelectorAll('[data-jump]').forEach(b => b.classList.toggle('on', b.dataset.jump === id));
  const lab = document.getElementById('lab'); if (lab) lab.textContent = `${sc.f}: ${sc.l}`;
}
function go(id, tr = 'push') { const n = SCREENS[id].pop || 0; if (n) stack.splice(Math.max(0, stack.length - n)); stack.push(id); render(id, tr); }
function back() {
  if (stack.length < 2) return; const cur = stack.pop(); const prev = stack[stack.length - 1];
  const t = SCREENS[cur].modal ? 'down' : (/(cancelar|reposicion)$/.test(cur) ? 'none' : 'pop'); render(prev, t);
}
function setPath(path, val) { const ks = path.split('.'); let o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val === 'true' ? true : val === 'false' ? false : val; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-go],[data-back],[data-jump]'); if (!t || t.disabled) return;
  if (t.dataset.jump) { stack = [t.dataset.jump]; render(t.dataset.jump, 'none'); return; }
  if (t.dataset.set) t.dataset.set.split(';').forEach(p => { const i = p.indexOf('='); setPath(p.slice(0, i), p.slice(i + 1)); });
  if (t.dataset.go) {
    if (stack[stack.length - 1] === t.dataset.go) return render(t.dataset.go);
    const tr = t.dataset.tr || (SCREENS[t.dataset.go].modal ? 'up' : 'push');
    if (SCREENS[t.dataset.go].tab && tr === 'none') stack = [];
    return go(t.dataset.go, tr);
  }
  if (t.dataset.back !== undefined) return back();
  render(stack[stack.length - 1]);
});

function boot() {
  const q = new URLSearchParams(location.search); const shot = q.get('shot');
  if (shot) document.body.classList.add('shot');
  const side = document.getElementById('side');
  if (side) {
    const groups = {}; Object.entries(SCREENS).forEach(([id, s]) => (groups[s.f] = groups[s.f] || []).push([id, s.l]));
    let n = 0;
    side.innerHTML += Object.entries(groups).map(([g, items]) => `<div class="side__g"><p>${g}</p>${items.map(([id, l]) => `<button data-jump="${id}"><span>${String(++n).padStart(2, '0')}</span>${l}</button>`).join('')}</div>`).join('');
  }
  const start = shot || q.get('s') || 'splash';
  stack = [start]; render(start);
}
window.addEventListener('DOMContentLoaded', boot);
window.PANDA = { SCREENS, S, render, setPath };
</script>
